services:
  postgres:
    image: postgres:16-alpine
    container_name: bawaba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bawaba
      POSTGRES_PASSWORD: ${BAWABA_DB_PASSWORD:-bawaba_secret}
      POSTGRES_DB: bawaba
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_audit_schema.sql:/docker-entrypoint-initdb.d/001_audit_schema.sql
      - ./migrations/002_demo_evidence.sql:/docker-entrypoint-initdb.d/002_demo_evidence.sql
      - ./migrations/003_control_plane.sql:/docker-entrypoint-initdb.d/003_control_plane.sql
      - ./migrations/004_demo_sessions.sql:/docker-entrypoint-initdb.d/004_demo_sessions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bawaba -d bawaba"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # P4 — REAL upstream backend: the invoice/payment ledger the gateway
  # forwards allowed calls to. Deny = this process never hears the call.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bawaba-demo-backend
    restart: unless-stopped
    entrypoint: ["/app/bawaba-demo-backend"]
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bawaba-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      BAWABA_CONFIG_PATH: /app/configs/bawaba.yaml
      BAWABA_DB_URL: postgres://bawaba:${BAWABA_DB_PASSWORD:-bawaba_secret}@postgres:5432/bawaba?sslmode=disable
      BAWABA_SIGNING_KEY_PATH: /app/keys/ed25519.key
      BAWABA_LOG_LEVEL: info
      BAWABA_PORT: "8080"
      BAWABA_API_PORT: "8081"
      BAWABA_AGENT_KEY_test-agent: ${BAWABA_AGENT_KEY_test_agent:-test-key-12345}
      BAWABA_AGENT_KEY_claude-code: ${BAWABA_AGENT_KEY_claude_code:-claude-key-67890}
      BAWABA_AGENT_KEY_cursor-ide: ${BAWABA_AGENT_KEY_cursor_ide:-cursor-key-11111}
      BAWABA_AGENT_KEY_payment-assistant: ${BAWABA_AGENT_KEY_payment_assistant:-payment-key-33333}
      BAWABA_AGENT_KEY_finance-analyst-eu: ${BAWABA_AGENT_KEY_finance_analyst_eu:-finance-key-44444}
      BAWABA_AGENT_KEY_burst-agent: ${BAWABA_AGENT_KEY_burst_agent:-burst-key-55555}
      BAWABA_AGENT_KEY_apac-analyst: ${BAWABA_AGENT_KEY_apac_analyst:-apac-key-66666}
      # P3 — Souffleur (translation-only; unset = explain endpoint answers 503, never invents)
      BAWABA_SOUFFLEUR_PROVIDER: ${BAWABA_SOUFFLEUR_PROVIDER:-}
      BAWABA_SOUFFLEUR_API_KEY: ${BAWABA_SOUFFLEUR_API_KEY:-}
      BAWABA_SOUFFLEUR_MODEL: ${BAWABA_SOUFFLEUR_MODEL:-}
      BAWABA_SOUFFLEUR_BASE_URL: ${BAWABA_SOUFFLEUR_BASE_URL:-}
      # P3 — public shareable demo: mutations restricted to -demo- workspace clones
      BAWABA_PUBLIC_DEMO: ${BAWABA_PUBLIC_DEMO:-}
      # P4 — real upstream backend (enforcement: allow forwards, deny never arrives)
      BAWABA_UPSTREAM_DEMO_LEDGER_URL: http://backend:9090
    volumes:
      - gateway_keys:/app/keys
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  gateway_keys:
    driver: local

networks:
  backend:
    driver: bridge
