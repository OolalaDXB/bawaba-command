global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critical"
      group_wait: 10s

receivers:
  - name: "default"
    # Configure webhook/email/slack here for production
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/XXX"

  - name: "critical"
    # Configure critical alerts channel
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/XXX"
