<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAWABA · بوابة — Sovereign AI Control Plane</title>
    <meta name="description" content="Sovereign AI control plane for regulated financial institutions. Monitor, configure, and prove compliance for all AI agent activity." />
    <meta name="author" content="Bawaba" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="256x256" />
    <meta property="og:title" content="BAWABA — Sovereign AI Control Plane" />
    <meta property="og:description" content="The control and evidence plane for enterprise AI agents and the gateways they run through." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BAWABA" />
    <!-- OG crawlers (WhatsApp, Slack, LinkedIn) need an ABSOLUTE image URL; the
         marketing site hosts the canonical card. /og-image.png ships in this
         build too — point the URLs at the demo host once it is live. -->
    <meta property="og:image" content="https://bawaba.systems/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bawaba.systems/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before first paint to avoid a flash of the default theme.
      (function () {
        try {
          var t = localStorage.getItem('bawaba-theme');
          var allowed = ['institutional', 'maisons', 'ludography', 'beau'];
          document.documentElement.setAttribute('data-theme', allowed.indexOf(t) > -1 ? t : 'institutional');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'institutional');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
