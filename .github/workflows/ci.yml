name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bawaba
          POSTGRES_PASSWORD: bawaba_secret
          POSTGRES_DB: bawaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bawaba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U bawaba && break
            sleep 1
          done

      - name: Run migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: bawaba
          PGPASSWORD: bawaba_secret
          PGDATABASE: bawaba
        run: |
          if [ -f migrations/001_init.sql ]; then
            psql -f migrations/001_init.sql
          fi

      - name: Go Vet
        run: go vet ./internal/api/... ./internal/siem/...

      - name: Go Test
        env:
          BAWABA_TEST_DB_URL: postgres://bawaba:bawaba_secret@localhost:5432/bawaba?sslmode=disable
        run: go test ./internal/api/... ./internal/siem/... -v -race

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test-go

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bawaba-gateway .
