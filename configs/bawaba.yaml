server:
  port: 8080
  metrics_port: 9090
  log_level: info

database:
  url: postgres://bawaba:bawaba_secret@localhost:5432/bawaba?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

signing:
  key_path: ./keys/ed25519.key

agents:
  test-agent:
    auth: api_key
    allowed_tools:
      - echo
      - time
    denied_tools: []
    pii_mode: tokenize
    rate_limit: 1000/hour
    max_results: 50
    jurisdiction: ma

  # Guided Demo (P0) seeded agent — the DENY→edit→ALLOW scenario.
  payment-assistant:
    auth: api_key
    allowed_tools:
      - read_invoice
    denied_tools:
      - execute_payment
    pii_mode: none
    rate_limit: 1000/hour
    max_results: 50
    jurisdiction: eu

  # P1 conditional-envelope agent — the 25 000 vs 10 000 EUR scenario, on the
  # REAL attribute engine (never simulated).
  finance-analyst-eu:
    auth: api_key
    allowed_tools:
      - read_invoice
    denied_tools: []
    conditional_rules:
      - tool: execute_payment
        effect: allow
        amount_lte: 10000
        currencies: [EUR]
        jurisdictions: [eu]
    pii_mode: none
    rate_limit: 1000/hour
    max_results: 50
    jurisdiction: eu

  # P1 scenario agents: rate-limit burst + jurisdiction fail-closed.
  burst-agent:
    auth: api_key
    allowed_tools: [echo]
    denied_tools: []
    pii_mode: none
    rate_limit: 5/minute
    max_results: 50
    jurisdiction: ma

  apac-analyst:
    auth: api_key
    allowed_tools: [echo]
    denied_tools: []
    pii_mode: none
    rate_limit: 1000/hour
    max_results: 50
    jurisdiction: sg  # NOT in routing rules → fail-closed demo

  claude-code:
    auth: api_key
    allowed_tools:
      - database-query
      - git-read
      - jira-read
    denied_tools:
      - database-write
      - git-push
    pii_mode: tokenize
    rate_limit: 1000/hour
    max_results: 50
    jurisdiction: ma

  cursor-ide:
    auth: api_key
    allowed_tools:
      - git-read
      - git-write
    denied_tools: []
    pii_mode: tokenize
    rate_limit: 500/hour
    max_results: 100
    jurisdiction: ae

routing:
  default_backend: localhost
  rules:
    - jurisdiction: ma
      backend: inwi-dc-casa
      compliance: [loi-09-08, cndp]
    - jurisdiction: sa
      backend: stc-cloud-riyadh
      compliance: [pdpl, sama-scf]
    - jurisdiction: ae
      backend: g42-abu-dhabi
      compliance: [fpdl, difc, adgm]
    - jurisdiction: eu
      backend: hetzner-frankfurt
      compliance: [gdpr, dora]

audit:
  merkle_window_hours: 24
  retention_days: 2555
  siem_export:
    format: jsonlines
    endpoint: ""

quotas:
  default_limit: 1000
  period: 1h
  overrides:
    claude-code: 5000
    cursor-ide: 3000

siem:
  enabled: false
  type: webhook
  endpoint: ""
  token: ""
  format: json

# P4 — REAL upstream backends. Allowed calls are forwarded here; tools with
# no upstream are refused explicitly (fail closed, never simulated).
upstreams:
  - name: demo-ledger
    url: http://localhost:9090   # compose overrides via BAWABA_UPSTREAM_DEMO_LEDGER_URL
    tools: [read_invoice, execute_payment, kyc-lookup]
